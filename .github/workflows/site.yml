name: Manual website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Lint the manual (numbering, ELI5 boxes, section maps)
        run: python scripts/sync_manual.py --check
      - name: Build the site (strict, so broken links fail the build)
        run: mkdocs build --strict
      - name: Build the all-in-one MANUAL.md download
        run: python scripts/build_single_file.py site/MANUAL.md
      - name: Set up the PDF toolchain (Chromium + emoji font)
        run: |
          pip install -r requirements-pdf.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji
      - name: Build the printable PDF book (US Letter)
        run: python scripts/build_pdf.py --out site/MANUAL.pdf --previews site/assets/pdf
      - name: Build the printable PDF book (A4)
        if: github.event_name != 'pull_request'
        run: python scripts/build_pdf.py --paper a4 --out site/MANUAL-A4.pdf
      - name: Attach the PDF to this run for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MANUAL-pdf
          path: site/MANUAL.pdf
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
