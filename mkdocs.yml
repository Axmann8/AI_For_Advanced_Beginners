site_name: AI for Advanced Beginners
site_description: >-
  The massive, friendly, hands-on manual for everything after "what is an LLM?":
  MCP, connectors, automation, agents, local AI, creative tools, and real life,
  with an ELI5 for everything.
site_url: https://axmann8.github.io/claude_cloud_trial_credits/
repo_url: https://github.com/Axmann8/claude_cloud_trial_credits
repo_name: Axmann8/claude_cloud_trial_credits
edit_uri: edit/main/manual/
docs_dir: manual
copyright: Made with ❤️ and Claude Code · Now go build something fun ✨

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/rocket-launch
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate

hooks:
  - scripts/mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Axmann8/claude_cloud_trial_credits
      name: The manual on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

